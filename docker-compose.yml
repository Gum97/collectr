name: collectr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collectr
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: collectr
      # Consumed by deploy/postgres/init/10-roles.sql to create the restricted
      # role the API server runs as.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    # Bound to the loopback interface explicitly. Docker's plain "5432:5432"
    # publishes on 0.0.0.0 and bypasses the host firewall, which would put a
    # database of personal data on the public internet by default.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectr -d collectr"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # An explicit memory ceiling and eviction policy. "Grow until the OOM killer
    # notices" is not a policy, and the default is exactly that.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Migrations run once, as the owner, before anything else starts.
  #
  # Neither the API server nor the worker migrates on boot: the API server runs
  # as a role that deliberately cannot create tables, and two processes racing to
  # apply the same migration is a problem worth not having.
  migrate:
    build: .
    command: ["/collectr", "-migrate"]
    restart: "no"
    environment:
      ENV: ${ENV:-prod}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      DATABASE_URL: postgres://collectr:${DB_PASSWORD}@postgres:5432/collectr?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TENANT_KEK: ${TENANT_KEK:?run `make secrets`}
      VISIT_PEPPER: ${VISIT_PEPPER:?run `make secrets`}
    depends_on:
      postgres: {condition: service_healthy}

  collectr:
    build: .
    environment:
      ENV: ${ENV:-prod}
      HTTP_ADDR: ":8080"
      BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      # The API server connects as collectr_app, for which the row-level security
      # policies are enforced. Running it as the owner would silently disable them.
      DATABASE_URL: postgres://collectr_app:${APP_DB_PASSWORD}@postgres:5432/collectr?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TENANT_KEK: ${TENANT_KEK:?run `make secrets`}
      VISIT_PEPPER: ${VISIT_PEPPER:?run `make secrets`}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/files
      DSR_SLA_HOURS: ${DSR_SLA_HOURS:-72}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-730}
      RAW_EVENT_RETENTION_DAYS: ${RAW_EVENT_RETENTION_DAYS:-90}
      DEPLOYMENT_ROLE: ${DEPLOYMENT_ROLE:-controller}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - files:/data/files
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/collectr", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["/collectr-worker"]
    environment:
      ENV: ${ENV:-prod}
      # The worker connects as the owner: rollups, retention sweeps and partition
      # maintenance are cross-tenant by nature and cannot run under RLS.
      DATABASE_URL: postgres://collectr:${DB_PASSWORD}@postgres:5432/collectr?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      BASE_URL: ${BASE_URL}
      TENANT_KEK: ${TENANT_KEK}
      VISIT_PEPPER: ${VISIT_PEPPER}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/files
      RAW_EVENT_RETENTION_DAYS: ${RAW_EVENT_RETENTION_DAYS:-90}
    volumes:
      - files:/data/files
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - collectr
    restart: unless-stopped

  # A local mail catcher, so invitations can be exercised without a real SMTP
  # account. `docker compose --profile dev up -d` turns it on; the web UI is on
  # :8025.
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Load generator. `docker compose --profile load run --rm k6 run /scripts/redirect.js`
  #
  # It runs inside the same Docker VM as the server, so it competes with it for
  # CPU and adds the VM's own network overhead. Treat every number it produces as
  # a floor, not a measurement of what the deployment can do.
  k6:
    profiles: ["load"]
    image: grafana/k6:latest
    volumes:
      - ./load:/scripts:ro
    environment:
      BASE_URL: ${LOAD_BASE_URL:-http://caddy}
      HOST_HEADER: ${LOAD_HOST:-localhost}
      FORM: ${LOAD_FORM:-fm_test}
      FORM_VERSION: ${LOAD_FORM_VERSION:-}
      CONSENT_DOC: ${LOAD_CONSENT_DOC:-}
      CONSENT_HASH: ${LOAD_CONSENT_HASH:-}
      RATE: ${LOAD_RATE:-100}
      LINKS: ${LOAD_LINKS:-500}

  # Object storage is off by default: at the volumes this design targets, local
  # disk is sufficient. `docker compose --profile s3 up -d` turns it on once the
  # thresholds in docs/06-deep-dives.md are reached.
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-collectr}
      # A default rather than a required variable: Compose interpolates every
      # service regardless of profile, so `:?` here would break `up` for the
      # majority who never enable s3. MinIO refuses to start on the placeholder,
      # which surfaces the mistake to the only people it affects.
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-SET_STORAGE_S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  files:
  caddydata:
  caddyconfig:
  miniodata:
